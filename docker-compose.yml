version: "3.9"

services:
  gateway:
    build: .
    container_name: ai-gateway

    ports:
      - "8000:8000"

    depends_on:
      - redis

    environment:
      REDIS_HOST: redis

  redis:
    image: redis:7-alpine

    container_name: ai-gateway-redis

    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus

    container_name: ai-gateway-prometheus

    ports:
      - "9090:9090"
