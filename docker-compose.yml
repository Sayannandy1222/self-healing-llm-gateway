services:
  gateway:
    build: .
    container_name: ai-gateway

    ports:
      - "8000:8000"

    depends_on:
      - redis
      - jaeger

    environment:
      REDIS_HOST: redis
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: self-healing-llm-gateway
      ENVIRONMENT: development

  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis

    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus
    container_name: ai-gateway-prometheus

    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: ai-gateway-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: ai-gateway-jaeger

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  grafana_data:
